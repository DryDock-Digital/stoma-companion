name: CI

# Lint + tests on every push and PR, for every component that ships:
#   backend      pure-maths + mocked-store tests (no Supabase, no GPU; ffmpeg for the extractor)
#   worker-colmap the engine adapter + COLMAP pose parser (no COLMAP binary needed)
#   web          type-check + production build of the patient app
# Fixture parity tests join once fixtures land (P0-3). Set STOMA_TEST_SUPABASE=1
# with SUPABASE_* secrets to also run the store contract against a live project.
on:
  push:
  pull_request:

jobs:
  backend:
    name: backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -q

  worker-colmap:
    name: worker-colmap · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend package (measure extra) + pytest
        run: pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: ruff check worker-colmap && ruff format --check worker-colmap
      - name: Tests (pytest)
        working-directory: worker-colmap
        run: pytest -q tests

  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
