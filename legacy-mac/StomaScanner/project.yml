name: StomaScanner
options:
  bundleIdPrefix: dev.stomapolar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  StomaScanner:
    type: application
    platform: iOS
    sources:
      - path: StomaScanner
      - path: SharedPhotogrammetry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stomapolar.scanner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: 88GBS27T8F
        INFOPLIST_FILE: StomaScanner/Info.plist
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  StomaCompanion:
    type: application
    platform: macOS
    sources:
      - path: CompanionMac
      - path: SharedPhotogrammetry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stomapolar.companion
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: 88GBS27T8F
        CODE_SIGN_ENTITLEMENTS: CompanionMac/StomaCompanion.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stoma Companion
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_OBJC_BRIDGING_HEADER: CompanionMac/StomaCompanion-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  StomaScanner:
    build:
      targets:
        StomaScanner: all
    run:
      config: Debug
  StomaCompanion:
    build:
      targets:
        StomaCompanion: all
    run:
      config: Debug
