# Netlify build config for the patient web app (P3). Builds web/ in demo mode
# (no VITE_API_BASE → simulated flow + sample result) and serves it over HTTPS so
# the live camera works on phones. Source stays private; Netlify only reads to build.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
