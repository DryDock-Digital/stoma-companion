[project]
name = "stoma-backend"
version = "0.1.0"
description = "Stoma Companion backend — job API, keyframe extraction, measurement pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",   # multipart uploads for POST /scans
    "supabase>=2.5",             # storage + job state (prod backend)
]

[project.optional-dependencies]
# Measurement maths (slice/metrics/outline/G-code/ArUco). Kept out of the base
# install so the API image stays lean; the measurement modules import these lazily.
measure = [
    "numpy>=1.26",
    "trimesh>=4.0",              # OBJ loading → vertices/faces (slice math is ported, not trimesh's)
    "opencv-python-headless>=4.9",  # cv2.aruco DICT_4X4_50 detection
]
reports = [
    "fpdf2>=2.7",               # design-control PDF export (P5-2)
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",               # FastAPI TestClient transport
    "ruff>=0.5",
    "stoma-backend[measure]",    # tests exercise the measurement port
    "stoma-backend[reports]",    # tests exercise the PDF export
]

[project.scripts]
# Verification scoreboards + experiment rigs (P2). Need the `measure` extra.
stoma-score = "app.verify.__main__:main"
stoma-score-orientation = "app.verify.orientation:main"
stoma-keyframe-sweep = "app.verify.keyframe_sweep:main"
stoma-cycle-budget = "app.cycle_time:main"
stoma-verification-report = "app.verify.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/File() in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
